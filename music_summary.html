<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC Radio 6 Music - 2-Year Airplay Wrap</title>
    <meta name="description" content="Explore the top artists, heavily rotated albums, and alternative legacy classics on BBC Radio 6 Music over the last 2 years (2024-2026).">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================================================
           Design System & Variables
           ========================================================================== */
        :root {
            --bg-dark: #07080e;
            --bg-card: rgba(18, 20, 32, 0.65);
            --border-glass: rgba(255, 255, 255, 0.07);
            --color-primary: #6366f1; /* Neon Indigo */
            --color-secondary: #ec4899; /* Neon Pink/Magenta */
            --color-accent: #10b981; /* Neon Emerald */
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --text-muted: #64748b;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           Base Styles
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Ambient Glow Background Orbs */
        .glow-bg {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
        }

        .orb-indigo {
            width: 50vw;
            height: 50vw;
            top: -10%;
            right: -10%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
        }

        .orb-pink {
            width: 60vw;
            height: 60vw;
            bottom: -20%;
            left: -10%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, transparent 70%);
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ==========================================================================
           Layout Container
           ========================================================================== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 10rem 1.5rem; /* Padding bottom for the fixed player */
        }

        /* ==========================================================================
           Header Styling
           ========================================================================== */
        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .header-badge {
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #818cf8;
            padding: 0.35rem 1rem;
            border-radius: 20px;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #fff 40%, var(--text-sub) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 3.5rem;
            }
        }

        .lead-text {
            color: var(--text-sub);
            max-width: 700px;
            margin: 0 auto;
            font-size: 1.05rem;
        }

        /* ==========================================================================
           Dashboard Controls & Navigation
           ========================================================================== */
        .controls-row {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 1.25rem;
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        @media (min-width: 768px) {
            .controls-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            overflow-x: auto;
            gap: 0.5rem;
            scrollbar-width: none; /* Firefox */
        }

        .nav-tabs::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            font-family: var(--font-heading);
            font-weight: 600;
            padding: 0.65rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .tab-btn.active {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        /* Search Input */
        .search-container {
            position: relative;
            max-width: 100%;
        }

        @media (min-width: 768px) {
            .search-container {
                width: 320px;
            }
        }

        .search-container i {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 0.65rem 1rem 0.65rem 2.25rem;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.15);
        }

        /* ==========================================================================
           Grid Layout & Cards
           ========================================================================== */
        .music-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 640px) {
            .music-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .music-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Song/Artist Card */
        .music-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 1.25rem;
            position: relative;
            cursor: pointer;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .music-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, transparent 100%);
            opacity: 0;
            transition: var(--transition);
        }

        .music-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .music-card:hover::before {
            opacity: 1;
        }

        .music-card.playing {
            border-color: var(--color-primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        /* Card Content details */
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            z-index: 2;
        }

        .badge-type {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .badge-2025 {
            background: rgba(236, 72, 153, 0.15);
            color: var(--color-secondary);
        }

        .badge-2024 {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .badge-classic {
            background: rgba(16, 179, 129, 0.15);
            color: var(--color-accent);
        }

        .play-indicator-icon {
            font-size: 1rem;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .music-card:hover .play-indicator-icon {
            color: #fff;
            transform: scale(1.1);
        }

        .music-card.playing .play-indicator-icon {
            color: var(--color-primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-details {
            z-index: 2;
            margin-bottom: 1rem;
        }

        .track-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .artist-name {
            font-size: 0.95rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .card-footer-info {
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.75rem;
            margin-top: auto;
        }

        .meta-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--color-primary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-link:hover {
            color: #fff;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .empty-state h3 {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* ==========================================================================
           Interactive Mock Audio Player
           ========================================================================== */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            background: rgba(10, 11, 18, 0.85);
            border-top: 1px solid var(--border-glass);
            padding: 1rem 1.5rem;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
        }

        .player-bar.active {
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            .player-bar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                height: 90px;
                padding: 0 3rem;
            }
        }

        /* Left Section: Track Info & Disc */
        .player-track-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Vinyl Disc Animation */
        .vinyl-container {
            width: 50px;
            height: 50px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2a2a 20%, #151515 21%, #151515 40%, #000 41%);
            border: 2px solid #333;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Grooves on vinyl */
        .vinyl-disc::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            right: 10%;
            bottom: 10%;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .vinyl-disc::after {
            content: '';
            position: absolute;
            top: 25%;
            left: 25%;
            right: 25%;
            bottom: 25%;
            border: 1px dashed rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .vinyl-center {
            position: absolute;
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            border-radius: 50%;
            border: 2px solid #000;
        }

        .spinning {
            animation: spinVinyl 3.5s linear infinite;
        }

        @keyframes spinVinyl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .player-metadata h4 {
            font-family: var(--font-heading);
            font-size: 1rem;
            color: #fff;
            margin-bottom: 0.15rem;
        }

        .player-metadata p {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* Center Section: Controls & Progress */
        .player-center {
            flex-grow: 1;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-control:hover {
            color: #fff;
        }

        .btn-control-play {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .btn-control-play:hover {
            background: var(--color-primary);
            color: #fff;
            transform: scale(1.05);
        }

        .player-progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .player-progress-bar {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .player-progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(to right, var(--color-primary), var(--color-secondary));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Right Section: Waveform visualizer */
        .player-visualizer {
            display: none;
            align-items: flex-end;
            gap: 3px;
            height: 30px;
            width: 100px;
        }

        @media (min-width: 768px) {
            .player-visualizer {
                display: flex;
            }
        }

        .wave-bar {
            width: 3px;
            background-color: var(--color-primary);
            height: 5%;
            border-radius: 2px;
        }

        .player-bar.playing .wave-bar {
            background-color: var(--color-primary);
            animation: bounce 1.2s ease-in-out infinite alternate;
        }

        .player-bar.playing .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .player-bar.playing .wave-bar:nth-child(3) { animation-delay: 0.3s; animation-duration: 0.8s; }
        .player-bar.playing .wave-bar:nth-child(4) { animation-delay: 0.45s; }
        .player-bar.playing .wave-bar:nth-child(5) { animation-delay: 0.2s; animation-duration: 1s; }
        .player-bar.playing .wave-bar:nth-child(6) { animation-delay: 0.6s; }

        @keyframes bounce {
            0% { height: 5%; }
            100% { height: 100%; }
        }
    </style>
</head>

    <div class="container">

            <div class="player-progress-container">

        <div class="player-visualizer">

        </div>
    </footer>

                artist: "Pixies",
                category: "classics",
                tag: "All-Time Legacy Play",
                description: "A defining track in the station's library, played consistently across daytime and evening slots.",
                soundsLink: "https://www.bbc.co.uk/sounds"
            },
            {
                id: "10",
                title: "Love Will Tear Us Apart",
                artist: "Joy Division",
                category: "classics",
                tag: "All-Time Legacy Play",
                description: "Broadcasting's most popular post-punk anthem, remaining in permanent rotation.",
                soundsLink: "https://www.bbc.co.uk/sounds"
            },
            {
                id: "11",
                title: "Connection",
                artist: "Elastica",
                category: "classics",
                tag: "90s Rotation Classic",
                description: "A regular daytime favorite, frequently used as a high-energy transition track by DJs.",
                soundsLink: "https://www.bbc.co.uk/sounds"
            },
            {
                id: "12",
                title: "Pull Up to the Bumper",
                artist: "Grace Jones",
                category: "classics",
                tag: "Dub/Funk Library Play",
                description: "A mainstay on Craig Charles' Funk and Soul Show and general daytime alternative programming.",
                soundsLink: "https://www.bbc.co.uk/sounds"
            }
        ];

        // UI State
        let currentFilter = 'all';
        let searchQuery = '';
        let playingSong = null;
        let isPlaying = false;
        let playbackProgress = 0;
        let progressInterval = null;

        // DOM elements
        const musicGrid = document.getElementById('musicGrid');
        const searchInput = document.getElementById('searchInput');
        const tabsContainer = document.getElementById('tabsContainer');
        const playerBar = document.getElementById('playerBar');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playerPlayBtn = document.getElementById('playerPlayBtn');
        const vinylDisc = document.getElementById('vinylDisc');
        const progressFill = document.getElementById('progressFill');
        const playerCurrentTime = document.getElementById('playerCurrentTime');

        // Initialize App
        renderCards();

        // Search event
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim().toLowerCase();
            renderCards();
        });

        // Tab filters event
        tabsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;

            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });
            btn.classList.add('active');
            btn.setAttribute('aria-selected', 'true');

            currentFilter = btn.dataset.filter;
            renderCards();
        });

        // Render Cards function
        function renderCards() {
            musicGrid.innerHTML = '';

            const filteredData = songData.filter(song => {
                const matchesFilter = currentFilter === 'all' || song.category === currentFilter;
                const matchesSearch = song.title.toLowerCase().includes(searchQuery) ||
                                     song.artist.toLowerCase().includes(searchQuery) ||
                                     song.description.toLowerCase().includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            if (filteredData.length === 0) {
                musicGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-compact-disc"></i>
                        <h3>No tracks found</h3>
                        <p>Adjust your search filters to find other entries in our 6 Music wrap.</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach(song => {
                const isCurrent = playingSong && playingSong.id === song.id;
                
                const card = document.createElement('div');
                card.className = `music-card ${isCurrent && isPlaying ? 'playing' : ''}`;
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `Play ${song.title} by ${song.artist}`);
                
                card.addEventListener('click', () => handleCardClick(song));
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleCardClick(song);
                    }
                });

                const badgeClass = song.category === '2025' ? 'badge-2025' : 
                                   song.category === '2024' ? 'badge-2024' : 'badge-classic';
                const labelText = song.category === 'classics' ? 'Legacy Classic' : `${song.category} Play`;

                card.innerHTML = `
                    <div class="card-header-row">
                        <span class="badge-type ${badgeClass}">${labelText}</span>
                        <div class="play-indicator-icon">
                            <i class="fa-solid ${isCurrent && isPlaying ? 'fa-pause' : 'fa-play'}"></i>
                        </div>
                    </div>
                    <div class="card-details">
                        <h3 class="track-title">${song.title}</h3>
                        <p class="artist-name">${song.artist}</p>
                        <p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 0.5rem;">${song.description}</p>
                    </div>
                    <div class="card-footer-info">
                        <span class="meta-tag"><i class="fa-solid fa-hashtag"></i> ${song.tag}</span>
                        <a href="${song.soundsLink}" target="_blank" class="btn-link" onclick="event.stopPropagation()">
                            Listen <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.65rem;"></i>
                        </a>
                    </div>
                `;

                musicGrid.appendChild(card);
            });
        }

        // Handle card click
        function handleCardClick(song) {
            if (playingSong && playingSong.id === song.id) {
                // Toggle play/pause
                togglePlayback();
            } else {
                // Load and play new song
                playingSong = song;
                isPlaying = true;
                playbackProgress = 0;
                
                playerTitle.textContent = song.title;
                playerArtist.textContent = song.artist;
                playerPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                
                playerBar.classList.add('active');
                playerBar.classList.add('playing');
                vinylDisc.classList.add('spinning');
                
                startProgressTimer();
                renderCards();
            }
        }

        // Play/Pause Action
        playerPlayBtn.addEventListener('click', togglePlayback);

        function togglePlayback() {
            if (!playingSong) return;

            isPlaying = !isPlaying;
            if (isPlaying) {
                playerPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                playerBar.classList.add('playing');
                vinylDisc.classList.add('spinning');
                startProgressTimer();
            } else {
                playerPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                playerBar.classList.remove('playing');
                vinylDisc.classList.remove('spinning');
                clearInterval(progressInterval);
            }
            renderCards();
        }

        // Mock Progress Slider
        function startProgressTimer() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (playbackProgress >= 100) {
                    // Reset on completion
                    playbackProgress = 0;
                    isPlaying = false;
                    playerPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                    playerBar.classList.remove('playing');
                    vinylDisc.classList.remove('spinning');
                    clearInterval(progressInterval);
                    renderCards();
                } else {
                    playbackProgress += 3.33; // Mock 30 seconds total (10% every 3s, so ~3.33% per second)
                    progressFill.style.width = `${playbackProgress}%`;
                    
                    // Calc display time
                    const totalSecs = Math.min(30, Math.floor((playbackProgress / 100) * 30));
                    const secondsStr = totalSecs < 10 ? `0${totalSecs}` : totalSecs;
                    playerCurrentTime.textContent = `0:${secondsStr}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
